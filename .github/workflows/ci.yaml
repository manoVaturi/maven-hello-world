name: myapp CI Pipeline
on:
   push:
      branches: [master]
      paths-ignore: ["**.md", ".gitignore"]
   pull_request:
      branches: [master]
   workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege.
permissions:
   contents: read

env:
   IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/myapp
   JAVA_VERSION: "8"
   JAVA_DISTRIBUTION: "temurin"
   WORKING_DIR: "myapp"

jobs:
   maven-build:
      name: Build, Test & Scan
      runs-on: ubuntu-latest
      outputs:
         version: ${{ steps.version.outputs.version }}

      steps:
         # Checkout
         - name: Checkout Source Code
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         - name: SAST scan with Semgrep
           run: |
              set -euo pipefail
              docker run --rm -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep \
              semgrep scan --config auto --severity ERROR --severity WARNING

         - name: Setup JDK ${{ env.JAVA_VERSION }}
           uses: actions/setup-java@v6
           with:
              java-version: ${{ env.JAVA_VERSION }}
              distribution: ${{ env.JAVA_DISTRIBUTION }}
              cache: maven

         - name: Resolve next version
           id: version
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              set -euo pipefail
              git fetch --tags --force --quiet


              # Extract baseline from pom.xml
              BASE=$(mvn -q -B -ntp -DforceStdout help:evaluate -Dexpression=project.version)
              SERIES=$(echo "$BASE" | cut -d. -f1,2)


              # Match latest git tag in the current release series
              LAST=$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)


              if [ -z "$LAST" ]; then
              VERSION="${SERIES}.1"
              else
              VERSION="${SERIES}.$(( ${LAST##*.} + 1 ))"
              fi

              echo "version=$VERSION" >> "$GITHUB_OUTPUT"


              # Generate audit log in Step Summary
              {

              echo "### Version \`${VERSION}\`"

              echo ""

              echo "| pom base | last tag | next |"
              echo "|---|---|---|"
              echo "| \`${BASE}\` | \`${LAST:-none}\` | \`${VERSION}\` |"

              } >> "$GITHUB_STEP_SUMMARY"

         - name: Stamp versiion into the POM
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              mvn -B -ntp versions:set \
              -DnewVersion="${{ steps.version.outputs.version }}" \
              -DgenerateBackupPoms=false

         - name: Compile and run unit Tests
           working-directory: ${{ env.WORKING_DIR }}
           run: mvn -B -ntp clean verify

         - name: Upload JAR
           uses: actions/upload-artifact@v7
           with:
              name: myapp-${{ steps.version.outputs.version }}
              path: myapp/target/myapp-${{ steps.version.outputs.version }}.jar
              if-no-files-found: error
              retention-days: 30

   docker-image-build:
      name: Docker Image (build, scan, tests)
      needs: maven-build
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      permissions:
         contents: write
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - uses: actions/checkout@v7

         - uses: docker/setup-buildx-action@v4

         - name: Build image locally
           uses: docker/build-push-action@v7.3.0
           with:
              context: .
              file: Dockerfile
              load: true
              push: false
              build-args: |
                 APP_VERSION=${{ env.TAG }}
              tags: |
                 ${{ env.IMAGE_NAME }}:${{ env.TAG }}
                 ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
                 ${{ env.IMAGE_NAME }}:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max
              provenance: false

         - name: Smoke Test local container
           run: |
              set -euo pipefail

              OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

              echo "$OUT"
              echo "$OUT" | grep -qF "Hello World! from Mano"

         - name: Vulnerability Scan with Trivy
           uses: aquasecurity/trivy-action@v0.36.0
           with:
              image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
              format: "table"
              exit-code: "0"
              severity: "HIGH,CRITICAL"
              ignore-unfixed: true

         - name: Authenticate to Docker Hub
           if: github.event_name == 'push' && github.ref == 'refs/heads/master'
           uses: docker/login-action@v4
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Push image to docker hub
           if: github.event_name == 'push' && github.ref == 'refs/heads/master'
           run: |
              set -euo pipefail
              docker push "${IMAGE_NAME}:${TAG}"
              docker push ${{ env.IMAGE_NAME }}:latest

         - name: Tag release version
           run: |
              set -euo pipefail

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              git tag "v${{ env.TAG }}"

              git push origin "v${{ env.TAG }}"

   docker-pull-run:
      name: Pull image from Docker Hub & Run
      needs: [maven-build, docker-image-build]
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      runs-on: ubuntu-latest
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}

      steps:
         - name: Authenticate to Docker Hub
           if: github.event_name == 'push' && github.ref == 'refs/heads/master'
           uses: docker/login-action@v4
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}
         - name: Pull the Image
           run: docker pull "${IMAGE_NAME}:${TAG}"

         - name: Run Container and compare print
           run: |
              set -euo pipefail
              OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

              echo "$OUT"
              echo "$OUT" | grep -qF "Hello World! from Mano"
              echo "Published image verified"

   helm-deploy:
      name: Deploy to cluster with Helm
      needs: docker-pull-run
      runs-on: ubuntu-latest
      steps:
         - name: Create k8s Kind Cluster
           uses: helm/kind-action@v1
           with:
              cluster_name: return-home-cluster
