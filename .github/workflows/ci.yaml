name: myapp CI Pipeline
on:
   push:
      branches: [feature/**]
      # branches: [master]
      paths-ignore: ["**.md", ".gitignore"]
   pull_request:
      branches: [master]
   workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege.
permissions:
   contents: read

env:
   IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/myapp
   JAVA_VERSION: "8"
   JAVA_DISTRIBUTION: "temurin"
   WORKING_DIR: "myapp"
   HELM_CHART_DIR: "helm"
   APP_MESSAGE: "Hello World! from Mano"

jobs:
   changes:
      name: Detect App Code changes
      runs-on: ubuntu-latest
      timeout-minutes: 5
      outputs:
         app: ${{ steps.filter.outputs.app }}
         chart: ${{ steps.filter.outputs.chart }}
      steps:
         - uses: actions/checkout@v7

         - name: Check for app/ chart changes
           id: filter
           uses: dorny/paths-filter@v4.0.3
           with:
              filters: |
                 app:
                   - 'myapp/**'
                   - 'Dockerfile'
                   - '.dockerignore'
                 chart:
                   - 'helm/**'

   static-analysis:
      name: Static Analysis (SAST, Dockerfile)
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
         - uses: actions/checkout@v7

         - name: Lint Dockerfile with hadolint
           uses: hadolint/hadolint-action@v3.5.0
           with:
              dockerfile: Dockerfile

         - name: SAST scan with Semgrep
           run: |
              set -euo pipefail

              docker run --rm -v "${{ github.workspace }}:/src" -w /src \
              semgrep/semgrep:1.86.0 \
              semgrep scan --config p/ci \
              --severity ERROR --severity WARNING --metrics=off --error \
              --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

   # chart-validation:
   #    name: Validation of Helm Chart
   #    runs-on: ubuntu-latest
   #    timeout-minutes: 10
   #    steps:
   #       - uses: actions/checkout@v7

   #       - uses: azure/setup-helm@v5.0.0

   #       - name: Lint chart
   #         run: |
   #            set -euo pipefail

   #            helm lint "${HELM_CHART_DIR}" --strict

   #       - name: Render templates
   #         run: helm template myapp "${{ env.HELM_CHART_DIR }}" --output-dir rendered

   #       - name: Validate rendered manifests against k8s schema
   #         uses: docker://ghcr.io/yannh/kubeconform:latest
   #         with:
   #            entrypoint: /kubeconform
   #            args: -strict -summary rendered

   maven-build:
      name: Build, Test & Scan
      runs-on: ubuntu-latest
      timeout-minutes: 20
      outputs:
         version: ${{ steps.version.outputs.version }}
      steps:
         - name: Checkout Source Code
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         - name: Setup JDK ${{ env.JAVA_VERSION }}
           uses: actions/setup-java@v6
           with:
              java-version: ${{ env.JAVA_VERSION }}
              distribution: ${{ env.JAVA_DISTRIBUTION }}
              cache: maven

         - name: Resolve next version
           id: version
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              set -euo pipefail
              git fetch --tags --force --quiet

              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                 BASE="manual"
                 LAST=""
                 VERSION="1.0.0"
                 echo "Manual trigger - using fixed test version ${VERSION}"
              else
                 BASE=$(mvn -q -B -ntp -DforceStdout help:evaluate -Dexpression=project.version)
                 SERIES=$(echo "$BASE" | cut -d. -f1,2)

                 LAST=$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)

                 if [ -z "$LAST" ]; then
                    VERSION="${SERIES}.0"
                 else
                    VERSION="${SERIES}.$(( ${LAST##*.} + 1 ))"
                 fi
              fi

              echo "version=$VERSION" >> "$GITHUB_OUTPUT"

              {
                 echo "### Version \`${VERSION}\`"
                 echo ""
                 echo "| pom base | last tag | next |"
                 echo "|---|---|---|"
                 echo "| \`${BASE}\` | \`${LAST:-none}\` | \`${VERSION}\` |"
              } >> "$GITHUB_STEP_SUMMARY"

         - name: Stamp version into the POM
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              set -euo pipefail
              mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                 -DnewVersion="${{ steps.version.outputs.version }}" \
                 -DgenerateBackupPoms=false

         - name: Compile and run unit tests
           working-directory: ${{ env.WORKING_DIR }}
           run: mvn -B -ntp clean verify

         - name: Upload test reports
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: test-reports-${{ steps.version.outputs.version }}
              path: myapp/target/surefire-reports/
              if-no-files-found: warn
              retention-days: 7

   docker-image-build:
      name: Docker Image (Build, Scan , Push)
      # needs: [changes, maven-build, static-analysis, chart-validation]
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      needs: [maven-build, static-analysis]
      runs-on: ubuntu-latest
      timeout-minutes: 20
      permissions:
         contents: write #tag push
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - uses: actions/checkout@v7

         - uses: docker/setup-buildx-action@v4

         - name: Build Image locally
           uses: docker/build-push-action@v7.3.0
           with:
              context: .
              file: Dockerfile
              load: true
              pull: false
              build-args: |
                 APP_VERSION=${{ env.TAG }}
              tags: |
                 ${{ env.IMAGE_NAME }}:${{ env.TAG }}
                 ${{ env.IMAGE_NAME }}:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max
              provenance: false

         - name: Smoke test local Container
           run: |
              set -euo pipefail

              OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

              echo "$OUT"
              echo "$OUT" | grep -qF "${{ env.APP_MESSAGE }}"

         - name: Vulnerability image scan with Trivy
           uses: aquasecurity/trivy-action@v0.36.0
           with:
              image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
              format: "table"
              exit-code: "0"
              severity: "HIGH,CRITICAL"
              ignore-unfixed: true

         - name: Authenticate to Docker Hub
           uses: docker/login-action@v4
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Push image to Docker Hub
           run: |
              set -euo pipefail

              docker push "${IMAGE_NAME}:${TAG}"
              docker push "${IMAGE_NAME}:latest"

               {
                  echo "### Published"
                  echo ""
                  echo "| field | value |"
                  echo "|---|---|"
                  echo "| tag | \`${TAG}\` |"
                  echo "| commit tag | \`sha-${GITHUB_SHA}\` |"
               } >> "$GITHUB_STEP_SUMMARY"

         - name: Tag release version
           if: github.event_name != 'workflow_dispatch'
           run: |
              set -euo pipefail
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "v${TAG}"
              git push origin "v${TAG}"

   docker-pull-run:
      name: Verify pushed image
      needs: [maven-build, docker-image-build]
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      runs-on: ubuntu-latest
      timeout-minutes: 10
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - name: Authenticate to Docker Hub
           uses: docker/login-action@v4
           with:
              username: ${{ secrets.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Pull image and run
           run: |
              set -euo pipefail

               docker pull "${IMAGE_NAME}:${TAG}"

               OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

               echo "$OUT"
               echo "$OUT" | grep -qF "${{ env.APP_MESSAGE }}"
               echo "Published image verified at ${TAG}"
