name: myapp CI Pipeline
on:
   push:
      branches: [master]
      paths-ignore: ["**.md", "docs/**", ".gitignore"]
   pull_request:
      branches: [master]
   workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
   IMAGE_NAME: ormano/myapp
   JAVA_VERSION: "8"
   JAVA_DISTRIBUTION: "temurin"

jobs:
   build-test-and-scan:
      name: Build, Test & Scan
      runs-on: ubuntu-latest

      steps:
         # Checkout
         - name: Checkout Source Code
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         - name: Setup JDK ${{ env.JAVA_VERSION }}
           uses: actions/setup-java@v6
           with:
              java-version: ${{ env.JAVA_VERSION }}
              distribution: ${{ env.JAVA_DISTRIBUTION }}
              cache: maven

         - name: Resolve next version
           id: version
           working-directory: myapp
           run: |
              set -euo pipefail
              git fetch --tags --force --quiet
              BASE=$(mvn -q -B -ntp -DforceStdout help:evaluate -Dexpression=project.version)
              SERIES=$(echo "$BASE" | cut -d. -f1,2)
              LAST=$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)
              if [ -z "$LAST" ]; then
              VERSION="${SERIES}.1"
              else
              VERSION="${SERIES}.$(( ${LAST##*.} + 1 ))"
              fi
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              {
              echo "### Version \`${VERSION}\`"
              echo ""
              echo "| pom base | last tag | next |"
              echo "|---|---|---|"
              echo "| \`${BASE}\` | \`${LAST:-none}\` | \`${VERSION}\` |"
              } >> "$GITHUB_STEP_SUMMARY"
