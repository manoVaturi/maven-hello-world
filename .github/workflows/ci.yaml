name: myapp CI Pipeline
on:
   push:
      branches:
         - master
   pull_request:
      branches:
         - master
   workflow_dispatch:

concurrency:
   group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege.
permissions:
   contents: read

env:
   IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/myapp
   JAVA_VERSION: "8"
   JAVA_DISTRIBUTION: "temurin"

   WORKING_DIR: "myapp"
   HELM_CHART_DIR: "helm"
   APP_MESSAGE: "Hello World! from Mano"

jobs:
   # Check if there any changes in the app code\dockerfile or chart
   changes:
      name: Detect App Code changes
      runs-on: ubuntu-latest
      timeout-minutes: 5
      outputs:
         app: ${{ steps.filter.outputs.app }}
         chart: ${{ steps.filter.outputs.chart }}
      steps:
         - uses: actions/checkout@v7

         - name: Check for app/ chart changes
           id: filter
           uses: dorny/paths-filter@v4.0.3
           with:
              filters: |
                 app:
                   - 'myapp/**'
                   - 'Dockerfile'
                   - '.dockerignore'
                 chart:
                   - 'helm/**'

   # Shift left SAST
   static-analysis:
      name: Static Analysis (SAST, Dockerfile & Secrets)
      uses: ./.github/workflows/static-analysis.yaml

   # Validation of cutom helm chart
   chart-validation:
      name: Validation of Helm Chart
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v7

         - uses: azure/setup-helm@v5.0.0

         - name: Lint chart
           run: |
              set -euo pipefail

              helm lint "${HELM_CHART_DIR}" --strict

         - name: Render templates
           run: |
              helm template myapp "${{ env.HELM_CHART_DIR }}" \
                 --set image.repository=validation-placeholder \
                 --set image.tag=0.0.0 \
                 --output-dir rendered

         - name: Validate rendered manifests against k8s schema
           uses: docker://ghcr.io/yannh/kubeconform:latest
           with:
              entrypoint: /kubeconform
              args: -strict -summary rendered

   # Maven build, tests and scans before packing to a container
   maven-build:
      name: Build, Test & Scan
      runs-on: ubuntu-latest
      timeout-minutes: 20
      outputs:
         version: ${{ steps.version.outputs.version }}
      steps:
         - name: Checkout Source Code
           uses: actions/checkout@v7
           with:
              fetch-depth: 0

         - name: Setup JDK ${{ env.JAVA_VERSION }}
           uses: actions/setup-java@v6
           with:
              java-version: ${{ env.JAVA_VERSION }}
              distribution: ${{ env.JAVA_DISTRIBUTION }}
              cache: maven

         - name: Resolve next version
           id: version
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              set -euo pipefail
              git fetch --tags --force --quiet

              # manual trigger = testing, dont bump the real version
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                 BASE="manual"
                 LAST=""
                 VERSION="1.0.0"
                 echo "Manual trigger - using fixed test version ${VERSION}"
              else
                 BASE=$(mvn -q -B -ntp -DforceStdout help:evaluate -Dexpression=project.version)
                 SERIES=$(echo "$BASE" | cut -d. -f1,2)

                 LAST=$(git tag -l "v${SERIES}.*" --sort=-v:refname | head -n1)

                 if [ -z "$LAST" ]; then
                    VERSION="${SERIES}.0"
                 else
                    VERSION="${SERIES}.$(( ${LAST##*.} + 1 ))"
                 fi
              fi

              echo "version=$VERSION" >> "$GITHUB_OUTPUT"

              {
                 echo "### Version \`${VERSION}\`"
                 echo ""
                 echo "| pom base | last tag | next |"
                 echo "|---|---|---|"
                 echo "| \`${BASE}\` | \`${LAST:-none}\` | \`${VERSION}\` |"
              } >> "$GITHUB_STEP_SUMMARY"

         - name: Stamp version into the POM
           working-directory: ${{ env.WORKING_DIR }}
           run: |
              set -euo pipefail
              mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.16.2:set \
                 -DnewVersion="${{ steps.version.outputs.version }}" \
                 -DgenerateBackupPoms=false

         - name: Compile and run unit tests
           working-directory: ${{ env.WORKING_DIR }}
           run: mvn -B -ntp clean verify

         - name: Upload test reports
           if: always()
           uses: actions/upload-artifact@v7
           with:
              name: test-reports-${{ steps.version.outputs.version }}
              path: myapp/target/surefire-reports/
              if-no-files-found: warn
              retention-days: 7

   # build, smoke-test and scan the image. runs pre-merge too, so a broken image never lands on master
   docker-image-build:
      name: Docker Image (Build, Scan)
      if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
      needs: [changes, maven-build, static-analysis]
      runs-on: ubuntu-latest
      timeout-minutes: 20
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - uses: actions/checkout@v7

         - uses: docker/setup-buildx-action@v4

         - name: Build Image locally
           uses: docker/build-push-action@v7.3.0
           with:
              context: .
              file: Dockerfile
              load: true
              pull: false
              build-args: |
                 APP_VERSION=${{ env.TAG }}
              tags: |
                 ${{ env.IMAGE_NAME }}:${{ env.TAG }}
                 ${{ env.IMAGE_NAME }}:latest
              cache-from: type=gha
              cache-to: type=gha,mode=max # needs buildx, docker driver cant export cache
              provenance: false

         - name: Smoke test local Container
           run: |
              set -euo pipefail

              OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

              echo "$OUT"
              echo "$OUT" | grep -qF "${{ env.APP_MESSAGE }}"

         - name: Vulnerability image scan with Trivy
           uses: aquasecurity/trivy-action@v0.36.0
           with:
              image-ref: ${{ env.IMAGE_NAME }}:${{ env.TAG }}
              format: "table"
              exit-code: "0"
              severity: "HIGH,CRITICAL"
              ignore-unfixed: true

         - name: Save image for helm-deploy
           run: docker save "${IMAGE_NAME}:${TAG}" -o /tmp/image.tar

         - name: Upload image artifact
           uses: actions/upload-artifact@v7
           with:
              name: docker-image-${{ env.TAG }}
              path: /tmp/image.tar
              retention-days: 1

   # spin up throwaway kind cluster and deploy with helm, local image only. runs pre-merge too
   helm-deploy:
      name: Create k8s cluster and deploy app with Helm
      needs: [changes, maven-build, docker-image-build]
      if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
      runs-on: ubuntu-latest
      timeout-minutes: 15
      permissions:
         contents: read

      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
         RELEASE: myapp
         NAMESPACE: myapp

      steps:
         - uses: actions/checkout@v7

         - uses: azure/setup-helm@v5

         - name: Create k8s Kind Cluster
           uses: helm/kind-action@v1.15.0
           with:
              cluster_name: return-home-cluster

         - name: Download image artifact
           uses: actions/download-artifact@v7
           with:
              name: docker-image-${{ env.TAG }}
              path: /tmp

         - name: Load image into cluster
           run: |
              set -euo pipefail

              docker load -i /tmp/image.tar
              kind load docker-image "${IMAGE_NAME}:${TAG}" --name return-home-cluster

         - name: Install helm chart
           run: |
              set -euo pipefail

              # plain --wait doesn't cover bare Jobs, only Deployments/StatefulSets/etc - need --wait-for-jobs too
              helm upgrade --install "${RELEASE}" "${HELM_CHART_DIR}" \
                 --namespace "${NAMESPACE}" \
                 --create-namespace \
                 --set image.repository="${IMAGE_NAME}" \
                 --set image.tag="${TAG}" \
                 --wait \
                 --wait-for-jobs \
                 --timeout 2m

         - name: Verify the job completed and printed correctly
           run: |
              set -euo pipefail

              JOB=$(kubectl get jobs -n "${NAMESPACE}" -l app.kubernetes.io/instance="${RELEASE}" -o jsonpath='{.items[0].metadata.name}')

              kubectl wait --for=condition=complete --timeout=60s "job/${JOB}" -n "${NAMESPACE}"

              OUT=$(kubectl logs "job/${JOB}" -n "${NAMESPACE}")
              echo "$OUT"
              echo "$OUT" | grep -qF "${{ env.APP_MESSAGE }}"

         - name: Debug on failure
           if: failure()
           # best effort, dont let a missing resource kill the debug step itself
           run: |
              set -x

              kubectl get pods -n "${NAMESPACE}" -o wide || true
              kubectl get jobs -n "${NAMESPACE}" -o wide || true

              kubectl describe job -l app.kubernetes.io/instance="${RELEASE}" -n "${NAMESPACE}" || true
              kubectl describe pods -l app.kubernetes.io/instance="${RELEASE}" -n "${NAMESPACE}" || true
              kubectl logs -l app.kubernetes.io/instance="${RELEASE}" -n "${NAMESPACE}" --all-containers --tail=200 || true
              kubectl get events -n "${NAMESPACE}" --sort-by=.lastTimestamp || true
              helm status "${RELEASE}" -n "${NAMESPACE}" || true

   # push to Docker Hub and tag the release. only after a real merge to master, never on a PR
   docker-image-publish:
      name: Publish image to Docker Hub
      needs: [maven-build, docker-image-build, helm-deploy]
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
         contents: write #tag push
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - uses: actions/checkout@v7

         - name: Download image artifact
           uses: actions/download-artifact@v7
           with:
              name: docker-image-${{ env.TAG }}
              path: /tmp

         - name: Load image
           run: docker load -i /tmp/image.tar

         - name: Authenticate to Docker Hub
           uses: docker/login-action@v4
           with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Push image to Docker Hub
           run: |
              set -euo pipefail

              docker push "${IMAGE_NAME}:${TAG}"

               {
                  echo "### Published"
                  echo ""
                  echo "| field | value |"
                  echo "|---|---|"
                  echo "| tag | \`${TAG}\` |"
                  echo "| commit tag | \`sha-${GITHUB_SHA}\` |"
               } >> "$GITHUB_STEP_SUMMARY"

         - name: Tag release version
           if: github.event_name != 'workflow_dispatch' # manual runs reuse 1.0.0, tag would already exist
           run: |
              set -euo pipefail

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"

              git tag "v${TAG}"
              git push origin "v${TAG}"

   # make sure what we pushed actually works, pull it back and run it
   docker-pull-run:
      name: Verify pushed image
      needs: [maven-build, docker-image-publish]
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      runs-on: ubuntu-latest
      timeout-minutes: 10
      env:
         TAG: ${{ needs['maven-build'].outputs.version }}
      steps:
         - name: Authenticate to Docker Hub
           uses: docker/login-action@v4
           with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

         - name: Pull image and run
           run: |
              set -euo pipefail

               docker pull "${IMAGE_NAME}:${TAG}"

               OUT=$(docker run --rm "${IMAGE_NAME}:${TAG}")

               echo "$OUT"
               echo "$OUT" | grep -qF "${{ env.APP_MESSAGE }}"
               echo "Published image verified at ${TAG}"
