jobs:
   helm-deploy:
      name: Deploy to cluster with Helm
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
      env:
         TAG: ${{ github.event.inputs.tag || '1.0.6' }}
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v7

         - name: Create k8s Kind Cluster
           uses: helm/kind-action@v1
           with:
              cluster_name: return-home-cluster

         - name: Create Image Pull Secret
           run: |
              kubectl create secret docker-registry dockerhub-secret \
                 --docker-server=https://index.docker.io/v1/ \
                 --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
                 --docker-password=${{ secrets.DOCKERHUB_TOKEN }}

         - name: Load image into kind cluster
           run: |
              set -euo pipefail
              docker pull "${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.TAG }}"
              kind load docker-image "${{ secrets.DOCKERHUB_USERNAME }}/myapp:${{ env.TAG }}" --name return-home-cluster

         - name: Install helm chart
           run: |
              helm upgrade --install myapp ./helm \
                 --set image.repository=${{ secrets.DOCKERHUB_USERNAME }}/myapp \
                 --set image.tag=${{ env.TAG }} \
                 --set image.pullPolicy=IfNotPresent \
                 --wait --wait-for-jobs \
                 --timeout 1m

         - name: Verify the job completed and printed correctly
           run: |
              set -euo pipefail
              kubectl wait --for=condition=complete job -l app.kubernetes.io/instance=myapp --timeout=30s

              POD=$(kubectl get pods -l app.kubernetes.io/instance=myapp -o jsonpath='{.items[0].metadata.name}')
              OUT=$(kubectl logs "$POD")

              echo "$OUT"
              if ! echo "$OUT" | grep -qF "Hello World! from Mano"; then
               echo "Error: Expected string 'Hello World! from Mano' was not found in the logs."
               exit 1 # This forces the pipeline to fail
               fi

              echo "Deploy verified: job completed and output matched"

         - name: Debug on failure
           if: failure()
           run: |
              kubectl get jobs,pods -l app.kubernetes.io/instance=myapp -o wide
              kubectl describe job -l app.kubernetes.io/instance=myapp
              POD=$(kubectl get pods -l app.kubernetes.io/instance=myapp -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
              if [ -n "$POD" ]; then kubectl logs "$POD" || true; fi
