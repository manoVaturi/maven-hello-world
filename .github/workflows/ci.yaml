name: myapp CI Pipeline
on:
   push:
      branches: [master, feature/**]
      paths-ignore: ["**.md", ".gitignore"]
   pull_request:
      branches: [master]
   workflow_dispatch:
      inputs:
         force_run:
            description: "Run the full pipeline (build, push, deploy) even with no app changes"
            type: boolean
            default: false
         tag:
            description: "Docker Hub image tag to deploy (fast-dev helm-deploy testing)"
            type: string
            default: "1.0.6"

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege.
permissions:
   contents: read

env:
   IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/myapp
   JAVA_VERSION: "8"
   JAVA_DISTRIBUTION: "temurin"
   WORKING_DIR: "myapp"

